<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | CrisCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="header-pagina">

    <h1>Galería</h1>

    <p>
      Descubrí algunos de nuestros productos y espacios.
    </p>

  </header>

  <main>

    <section class="galeria">

      <div class="galeria__grid">

        <article class="galeria__item">

          <img src="../assets/imgs/placeholder.webp"
               alt="Panificados artesanales">

        </article>

        <article class="galeria__item">

          <img src="../assets/imgs/placeholder.webp"
               alt="Cafetería">

        </article>

        <article class="galeria__item">

          <img src="../assets/imgs/placeholder.webp"
               alt="Almuerzos">

        </article>

        <article class="galeria__item">

          <img src="../assets/imgs/placeholder.webp"
               alt="Local">

        </article>

        <article class="galeria__item">

          <img src="../assets/imgs/placeholder.webp"
               alt="Facturas">

        </article>

        <article class="galeria__item">

          <img src="../assets/imgs/placeholder.webp"
               alt="Hamburguesas">

        </article>

      </div>

    </section>

    <section class="cta">

      <h2>¿Te gustó lo que viste?</h2>

      <p>
        Vení a disfrutar la experiencia CrisCar en cualquiera de nuestras sucursales.
      </p>

      <a class="btn btn-principal"
         href="contacto.html">

         Reservar

      </a>

    </section>
   <a class="btn btn-secundario" href="../index.html">
              Volver al inicio
   </a>
  </main>

<footer>
        <p>© 2026 CRISCAR - Panadería · Cafetería · Restaurante</p>
        <p>Todos los derechos reservados.</p> 
</footer>
</body>

</html>
